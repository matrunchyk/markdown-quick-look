name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

env:
  BASE_VERSION: "1.1"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test renderer
        run: ./scripts/test.sh
      - name: Set version
        id: version
        run: echo "version=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Install Developer ID certificate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk '/Developer ID Application/{print $2; exit}')"
          test -n "$signing_identity"
          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
      - name: Install notarization API key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode -o "$notary_key_path"
          chmod 600 "$notary_key_path"
          echo "NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
      - name: Build universal app
        run: ./scripts/build.sh
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify architectures
        run: |
          lipo -archs .build/DerivedData/Build/Products/Release/MarkdownQuickLook.app/Contents/MacOS/MarkdownQuickLook
          lipo -archs .build/DerivedData/Build/Products/Release/MarkdownQuickLook.app/Contents/PlugIns/MarkdownPreview.appex/Contents/MacOS/MarkdownPreview
      - name: Package DMG
        run: ./scripts/package-dmg.sh "${{ steps.version.outputs.version }}"
      - name: Notarize and staple DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./scripts/notarize-dmg.sh \
            ".build/releases/MarkdownQuickLook-${{ steps.version.outputs.version }}-universal.dmg" \
            "$SIGNING_IDENTITY"
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            ".build/releases/MarkdownQuickLook-${{ steps.version.outputs.version }}-universal.dmg" \
            --title "Markdown Quick Look ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
