name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

env:
  BASE_VERSION: "1.1"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test renderer
        run: ./scripts/test.sh
      - name: Set version
        id: version
        run: echo "version=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build universal app
        run: ./scripts/build.sh
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
      - name: Verify architectures
        run: |
          lipo -archs .build/DerivedData/Build/Products/Release/MarkdownQuickLook.app/Contents/MacOS/MarkdownQuickLook
          lipo -archs .build/DerivedData/Build/Products/Release/MarkdownQuickLook.app/Contents/PlugIns/MarkdownPreview.appex/Contents/MacOS/MarkdownPreview
      - name: Package DMG
        run: ./scripts/package-dmg.sh "${{ steps.version.outputs.version }}"
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            ".build/releases/MarkdownQuickLook-${{ steps.version.outputs.version }}-universal.dmg" \
            --title "Markdown Quick Look ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
